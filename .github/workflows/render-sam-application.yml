name: Render SAM application

on:
  push:
    branches:
      - claude/jolly-mendel-94pcrk
    paths:
      - applications/storage-asset-management-marketing-generalist/resume.json
      - applications/storage-asset-management-marketing-generalist/cover-letter.json
      - applications/storage-asset-management-marketing-generalist/fit.json

permissions:
  contents: write

jobs:
  render:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: pip install -r build/requirements.txt

      - name: Render application files
        run: |
          python3 build/render_resume.py applications/storage-asset-management-marketing-generalist/resume.json
          python3 build/render_cover_letter.py applications/storage-asset-management-marketing-generalist/cover-letter.json
          python3 build/score_meter.py applications/storage-asset-management-marketing-generalist/fit.json

      - name: Commit rendered files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            applications/storage-asset-management-marketing-generalist/resume.pdf \
            applications/storage-asset-management-marketing-generalist/resume.docx \
            applications/storage-asset-management-marketing-generalist/cover-letter.pdf \
            applications/storage-asset-management-marketing-generalist/cover-letter.docx \
            applications/storage-asset-management-marketing-generalist/fit.png
          if ! git diff --cached --quiet; then
            git commit -m "Render Storage Asset Management application files [skip ci]"
            git push
          fi
